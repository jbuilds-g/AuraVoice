name: Android CI

on:
  push:
    branches:
      - development
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.3.1'
      - name: Run unit tests
        run: gradle :app:testDebugUnitTest

  release:
    name: Build release APKs
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    env:
      KEYSTORE_PATH: ${{ github.workspace }}/my-upload-key.jks
      STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.3.1'
      - name: Restore release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
          chmod 600 "$KEYSTORE_PATH"
      - name: Run release unit tests
        run: gradle :app:testReleaseUnitTest
      - name: Build optimized release APKs
        run: gradle :app:assembleRelease
      - name: Verify and stage APKs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          for abi in arm64-v8a armeabi-v7a x86_64 universal; do
            apk="app/build/outputs/apk/release/app-$abi-release.apk"
            if [[ ! -f "$apk" ]]; then
              echo "Missing expected APK: $apk"
              exit 1
            fi
            cp "$apk" "artifacts/AuraVoice-$abi.apk"
          done
          ls -lh artifacts/
      - name: Upload release APKs
        uses: actions/upload-artifact@v7
        with:
          name: AuraVoice-release-apks
          path: artifacts/*.apk
          if-no-files-found: error
      - name: Remove temporary keystore
        if: always()
        shell: bash
        run: rm -f "$KEYSTORE_PATH"
